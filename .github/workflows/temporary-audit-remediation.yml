name: Repair Gabley audited transitive lock dependencies (temporary)
on:
  push:
    branches:
      - feat/gabley-property-matching-2026-10-12
permissions:
  contents: write
jobs:
  remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatible patches (remaining dev-only moderate issues may still return nonzero)
        run: npm audit fix --package-lock-only --ignore-scripts --no-audit --no-fund || true
      - name: Clean install from repaired lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require zero high/critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Validate unchanged package root dependencies
        run: node --experimental-strip-types scripts/verify-lockfile.ts
      - name: Commit only remediated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "fix(gabley): remediate high-severity transitive npm audit findings [skip ci]"
            git push origin HEAD:feat/gabley-property-matching-2026-10-12
          fi
