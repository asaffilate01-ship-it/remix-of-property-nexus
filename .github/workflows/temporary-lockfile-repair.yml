name: Repair development-branch npm lockfile (temporary)
on:
  push:
    branches:
      - feat/gabley-property-matching-2026-10-12
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recreate npm transitive lock metadata (no dependency scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check repository package-lock root
        run: node --experimental-strip-types scripts/verify-lockfile.ts
      - name: Prove a clean dependency installation is possible
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit only regenerated lockfile to the development branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "fix(gabley): regenerate npm lockfile for reproducible CI [skip ci]"
            git push origin HEAD:feat/gabley-property-matching-2026-10-12
          fi
