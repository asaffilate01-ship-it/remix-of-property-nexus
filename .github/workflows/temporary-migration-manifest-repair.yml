name: Rebuild Gabley migration hashes (temporary)
on:
  push:
    branches:
      - feat/gabley-property-matching-2026-10-12
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recreate hashes using the project's deterministic migration auditor
        run: npm run migrations:manifest
      - name: Verify every SQL migration is hash-pinned
        run: npm run migrations:verify
      - name: Commit integrity manifest only
        run: |
          if ! git diff --quiet -- supabase/migration-manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- supabase/migration-manifest.json
            git commit -m "fix(gabley): pin missing existing migration hash [skip ci]"
            git push origin HEAD:feat/gabley-property-matching-2026-10-12
          fi
