name: Deal intelligence verification
on:
  pull_request:
    paths:
      - "src/lib/deal-intelligence.functions.ts"
      - "src/lib/domureva-bridge.server.ts"
      - "src/routes/_authenticated/deal-intelligence.tsx"
      - "src/routes/api.integrations.domureva.ts"
      - "src/lib/navigation.ts"
      - "supabase/migrations/**"
      - "supabase/migration-manifest.json"
      - "package.json"
      - ".github/workflows/deal-intelligence.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run migrations:verify
      - run: bun run build
